<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股當沖損益與自訂上下檔位試算 (含盈虧比目標)</title>
  <style>
    :root {
      --up-color: #e53935;
      --down-color: #43a047;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --rr-target-bg: #fff8e1; /* 盈虧比達標亮黃色背景 */
      --rr-stop-bg: #efebe9;   /* 停損檔位淺灰褐色背景 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a237e;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .form-group input, .form-group select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background-color: #f0f4f8;
      color: #333;
      font-weight: 600;
    }
    tr.current-price {
      background-color: #e8eaf6;
      font-weight: bold;
    }
    tr.rr-target-row {
      background-color: var(--rr-target-bg);
    }
    tr.rr-stop-row {
      background-color: var(--rr-stop-bg);
    }
    .text-profit { color: var(--up-color); font-weight: bold; }
    .text-loss { color: var(--down-color); font-weight: bold; }
    .text-center { text-align: center; }
    
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      vertical-align: middle;
    }
    .badge-target {
      background-color: #ffe082;
      color: #b71c1c;
      border: 1px solid #ffd54f;
    }
    .badge-stop {
      background-color: #d7ccc8;
      color: #3e2723;
      border: 1px solid #bcaaa4;
    }
    .badge-breakeven {
      background-color: #e1bee7;
      color: #4a148c;
      border: 1px solid #ce93d8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>台股當沖損益與上下檔位試算 (含盈虧比目標)</h1>

  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label for="action">交易方向</label>
        <select id="action" onchange="calculate()">
          <option value="long">做多 (先買後賣)</option>
          <option value="short">做空 (先賣後買)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="entryPrice">進場價格 (元)</label>
        <input type="number" id="entryPrice" value="100" step="0.01" min="0.01" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="shares">張數 (1張 = 1000股)</label>
        <input type="number" id="shares" value="1" min="1" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="discount">手續費折扣 (折)</label>
        <input type="number" id="discount" value="2.8" step="0.1" min="0" max="10" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="ticksRange">顯示檔位範圍 (上下幾檔)</label>
        <input type="number" id="ticksRange" value="10" min="1" max="50" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="stopTicks">停損設定 (退幾檔停損)</label>
        <input type="number" id="stopTicks" value="1" min="1" max="50" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="rrRatio">期望盈虧比 (風險報酬比)</label>
        <select id="rrRatio" onchange="calculate()">
          <option value="1">1 : 1 (獲利 = 1倍停損金額)</option>
          <option value="2" selected>1 : 2 (獲利 = 2倍停損金額)</option>
          <option value="3">1 : 3 (獲利 = 3倍停損金額)</option>
          <option value="4">1 : 4 (獲利 = 4倍停損金額)</option>
          <option value="5">1 : 5 (獲利 = 5倍停損金額)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 id="tableTitle">上下 10 檔出場損益預估</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="text-center">檔位</th>
            <th class="text-center">出場價格</th>
            <th>漲跌幅</th>
            <th>預估總手續費</th>
            <th>預估交易稅/券資費</th>
            <th>淨損益 (元)</th>
            <th>報酬率 (%)</th>
            <th class="text-center">盈虧比/停損標記</th>
          </tr>
        </thead>
        <tbody id="resultBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function getTickSize(price) {
    if (price < 10) return 0.01;
    if (price < 50) return 0.05;
    if (price < 100) return 0.1;
    if (price < 500) return 0.5;
    if (price < 1000) return 1.0;
    return 5.0;
  }

  function getPriceBySteps(basePrice, steps) {
    let price = basePrice;
    const direction = steps > 0 ? 1 : -1;
    const count = Math.abs(steps);

    for (let i = 0; i < count; i++) {
      let tick = getTickSize(price);
      if (direction === -1) {
        if ([10, 50, 100, 500, 1000].includes(Number(price.toFixed(2)))) {
          tick = getTickSize(price - 0.01);
        }
      }
      price += direction * tick;
      price = Math.round(price * 100) / 100;
    }
    return price;
  }

  function calculateNetProfit(action, entryPrice, exitPrice, totalShares, discountRatio) {
    const baseFeeRate = 0.001425;
    const taxRate = 0.0015;
    const borrowFeeRate = 0.0008;

    let buyPrice, sellPrice;
    if (action === 'long') {
      buyPrice = entryPrice;
      sellPrice = exitPrice;
    } else {
      buyPrice = exitPrice;
      sellPrice = entryPrice;
    }

    const buyAmount = buyPrice * totalShares;
    const sellAmount = sellPrice * totalShares;

    let buyFee = Math.floor(buyAmount * baseFeeRate * discountRatio);
    if (buyFee < 20) buyFee = 20;

    let sellFee = Math.floor(sellAmount * baseFeeRate * discountRatio);
    if (sellFee < 20) sellFee = 20;

    const totalFee = buyFee + sellFee;

    let taxAndBorrowFee = 0;
    if (action === 'long') {
      taxAndBorrowFee = Math.floor(sellAmount * taxRate);
    } else {
      taxAndBorrowFee = Math.floor(sellAmount * taxRate) + Math.floor(sellAmount * borrowFeeRate);
    }

    const rawProfit = sellAmount - buyAmount;
    const netProfit = rawProfit - totalFee - taxAndBorrowFee;
    const returnRate = ((netProfit / buyAmount) * 100).toFixed(2);

    return { buyAmount, totalFee, taxAndBorrowFee, netProfit, returnRate };
  }

  function calculate() {
    const action = document.getElementById('action').value;
    const entryPrice = parseFloat(document.getElementById('entryPrice').value) || 0;
    const sharesNum = parseInt(document.getElementById('shares').value) || 1;
    const totalShares = sharesNum * 1000;
    const discountRatio = (parseFloat(document.getElementById('discount').value) || 10) / 10;
    const ticksRange = Math.max(1, parseInt(document.getElementById('ticksRange').value) || 10);
    const stopTicks = parseInt(document.getElementById('stopTicks').value) || 1;
    const rrRatioTarget = parseInt(document.getElementById('rrRatio').value) || 2;

    // 更新表格標題
    document.getElementById('tableTitle').innerText = `上下 ${ticksRange} 檔出場損益預估`;

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';

    if (entryPrice <= 0) return;

    // 1. 計算停損價位的淨虧損金額 (風險金額)
    const stopStep = action === 'long' ? -stopTicks : stopTicks;
    const stopExitPrice = getPriceBySteps(entryPrice, stopStep);
    const stopRes = calculateNetProfit(action, entryPrice, stopExitPrice, totalShares, discountRatio);
    const expectedRiskAmount = Math.abs(stopRes.netProfit);

    // 2. 算好上下 N 檔數據
    const rows = [];
    for (let i = ticksRange; i >= -ticksRange; i--) {
      const exitPrice = getPriceBySteps(entryPrice, i);
      const res = calculateNetProfit(action, entryPrice, exitPrice, totalShares, discountRatio);
      rows.push({ step: i, exitPrice, ...res });
    }

    // 3. 尋找扣掉交易成本後，淨獲利能滿足 淨獲利 >= 風險金額 * rrRatioTarget 的第一個檔位
    let targetStep = null;
    if (action === 'long') {
      for (let i = 1; i <= ticksRange; i++) {
        const item = rows.find(r => r.step === i);
        if (item && item.netProfit >= expectedRiskAmount * rrRatioTarget) {
          targetStep = i;
          break;
        }
      }
    } else {
      for (let i = -1; i >= -ticksRange; i--) {
        const item = rows.find(r => r.step === i);
        if (item && item.netProfit >= expectedRiskAmount * rrRatioTarget) {
          targetStep = i;
          break;
        }
      }
    }

    // 4. 渲染表格
    rows.forEach(item => {
      const exitPrice = item.exitPrice;
      const netProfit = item.netProfit;
      const returnRate = item.returnRate;
      const priceDiffPercent = (((exitPrice - entryPrice) / entryPrice) * 100).toFixed(2);

      const tr = document.createElement('tr');
      let noteTag = '';

      if (item.step === 0) {
        tr.classList.add('current-price');
        noteTag = `<span class="badge badge-breakeven">進場原價</span>`;
      } else if (item.step === stopStep) {
        tr.classList.add('rr-stop-row');
        noteTag = `<span class="badge badge-stop">預設停損 (退 ${stopTicks} 檔)</span>`;
      } else if (item.step === targetStep) {
        tr.classList.add('rr-target-row');
        noteTag = `<span class="badge badge-target">🎯 盈虧比 1:${rrRatioTarget} 達標檔位</span>`;
      }

      const profitClass = netProfit > 0 ? 'text-profit' : (netProfit < 0 ? 'text-loss' : '');
      const stepText = item.step > 0 ? `+${item.step} 檔` : (item.step < 0 ? `${item.step} 檔` : '進場價');

      tr.innerHTML = `
        <td class="text-center">${stepText}</td>
        <td class="text-center">${exitPrice.toFixed(2)}</td>
        <td class="${priceDiffPercent > 0 ? 'text-profit' : (priceDiffPercent < 0 ? 'text-loss' : '')}">
          ${priceDiffPercent > 0 ? '+' : ''}${priceDiffPercent}%
        </td>
        <td>$${item.totalFee.toLocaleString()}</td>
        <td>$${item.taxAndBorrowFee.toLocaleString()}</td>
        <td class="${profitClass}">$${item.netProfit.toLocaleString()}</td>
        <td class="${profitClass}">${returnRate}%</td>
        <td class="text-center">${noteTag}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  calculate();
</script>

</body>
</html>
